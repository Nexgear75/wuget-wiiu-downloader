[package]
name = "wuget"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Télécharge et déchiffre du contenu Wii U en une seule commande"

[dependencies]
aes = "0.9.2"
anyhow = "1.0.104"
cbc = { version = "0.2.1", features = ["block-padding"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
hex = "0.4.3"
indicatif = "0.18.6"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
ureq = "3.4.0"
