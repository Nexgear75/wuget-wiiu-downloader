name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: wuget-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: wuget-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: wuget-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: wuget-windows-x86_64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/wuget ${{ matrix.asset }}

      - name: Stage binary (windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\wuget.exe ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
